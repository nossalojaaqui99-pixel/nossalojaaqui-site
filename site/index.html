<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nossalojaaqui | Catálogo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  color: #ddd;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 16px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  transition: .2s;
}

.product:hover {
  transform: translateY(-3px);
}

.product img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  background: #eee;
}

.product-info {
  padding: 15px;
}

.product h2 {
  font-size: 18px;
  margin: 0 0 10px;
}

.price {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 12px;
}

.button {
  display: block;
  width: 100%;
  text-align: center;
  background: #25d366;
  color: white;
  text-decoration: none;
  padding: 13px;
  border-radius: 8px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Nossalojaaqui</h1>
  <p>Encontre ofertas e produtos selecionados</p>
</header>

<div class="container">

<input
  type="search"
  id="search"
  class="search"
  placeholder="🔎 Procurar produto..."
>

<div id="products" class="products">

<div class="product">
  <img src="https://via.placeholder.com/500x500?text=Produto+1" alt="Produto 1">
  <div class="product-info">
    <h2>Produto de exemplo</h2>
    <div class="price">R$ 39,90</div>
    <a class="button" href="#" target="_blank">
      Comprar produto
    </a>
  </div>
</div>

</div>
</div>

<footer>
  © 2026 Nossalojaaqui
</footer>

<script>
const search = document.getElementById("search");

search.addEventListener("input", function() {
  const texto = this.value.toLowerCase();

  document.querySelectorAll(".product").forEach(function(produto) {
    const nome = produto.innerText.toLowerCase();

    produto.style.display =
      nome.includes(texto) ? "" : "none";
  });
});
</script>

</body>
</html>
