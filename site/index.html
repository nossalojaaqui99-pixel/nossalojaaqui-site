<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nossalojaaqui | Ofertas e Produtos</title>

  <meta
    name="description"
    content="Nossalojaaqui - Encontre produtos e ofertas selecionadas."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #ddd;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    #search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 25px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(220px, 1fr)
      );
      gap: 20px;
    }

    .product {
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: #fff;
    }

    .product-info {
      padding: 15px;
    }

    .product h2 {
      font-size: 17px;
      margin: 0 0 10px;
      line-height: 1.3;
    }

    .price {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .buy {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      background: #25d366;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Nossalojaaqui</h1>
  <p>Encontre ofertas e produtos selecionados</p>
</header>

<div class="container">

  <input
    type="search"
    id="search"
    placeholder="🔎 Procurar produto..."
  >

  <div id="products">
    <div class="loading">
      Carregando produtos...
    </div>
  </div>

</div>

<footer>
  © 2026 Nossalojaaqui
</footer>

<script>

const products = document.getElementById("products");
const search = document.getElementById("search");

let listaProdutos = [];

// ==========================================
// CARREGAR PRODUTOS
// ==========================================

async function carregarProdutos() {

  try {

    const resposta = await fetch("/api/produtos");

    const dados = await resposta.json();

    if (!resposta.ok || dados.sucesso === false) {
      throw new Error(
        dados.erro || "Não foi possível carregar os produtos."
      );
    }

    listaProdutos = dados.produtos || [];

    mostrarProdutos(listaProdutos);

  } catch (erro) {

    console.error(erro);

    products.innerHTML = `
      <div class="error">
        ❌ Não foi possível carregar os produtos.
      </div>
    `;
  }
}

// ==========================================
// MOSTRAR PRODUTOS
// ==========================================

function mostrarProdutos(lista) {

  if (!lista.length) {

    products.innerHTML = `
      <div class="empty">
        Nenhum produto cadastrado ainda.
      </div>
    `;

    return;
  }

  products.innerHTML = "";

  lista.forEach(produto => {

    const card = document.createElement("div");

    card.className = "product";

    const imagem =
      produto.image_url ||
      "https://via.placeholder.com/500x500?text=Produto";

    const nome =
      produto.name ||
      "Produto";

    const preco =
      Number(produto.price || 0)
        .toFixed(2)
        .replace(".", ",");

    const link =
      produto.shopee_url ||
      "#";

    card.innerHTML = `

      <img
        src="${imagem}"
        alt="${nome}"
        onerror="this.src='https://via.placeholder.com/500x500?text=Produto'"
      >

      <div class="product-info">

        <h2>${nome}</h2>

        <div class="price">
          R$ ${preco}
        </div>

        <a
          class="buy"
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >
          🛒 Comprar produto
        </a>

      </div>

    `;

    products.appendChild(card);

  });
}

// ==========================================
// PESQUISA
// ==========================================

search.addEventListener("input", function() {

  const texto =
    this.value
      .toLowerCase()
      .trim();

  const filtrados =
    listaProdutos.filter(produto => {

      const nome =
        String(produto.name || "")
          .toLowerCase();

      return nome.includes(texto);

    });

  mostrarProdutos(filtrados);

});

// ==========================================
// INICIAR
// ==========================================

carregarProdutos();

</script>

</body>
</html>
