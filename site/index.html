<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nossalojaaqui | Ofertas e Produtos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ddd;
      font-size: 16px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
    }

    .search {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 25px;
      outline: none;
    }

    .search:focus {
      border-color: #25d366;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(220px, 1fr)
      );
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-3px);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background: white;
      display: block;
    }

    .product-info {
      padding: 16px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 10px;
      line-height: 1.3;
    }

    .product-description {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .buy-button {
      display: block;
      width: 100%;
      padding: 14px;
      background: #25d366;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .buy-button:hover {
      background: #1ebe5d;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #777;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 26px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 180px;
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        font-size: 15px;
      }

      .price {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ Nossalojaaqui</h1>
    <p>Encontre ofertas e produtos selecionados</p>
  </header>

  <main class="container">

    <input
      type="search"
      id="search"
      class="search"
      placeholder="🔎 Procurar produto..."
    >

    <div id="products" class="products">
      <div class="message">
        Carregando produtos...
      </div>
    </div>

  </main>

  <footer>
    © 2026 Nossalojaaqui
  </footer>

  <script>

    const productsContainer =
      document.getElementById("products");

    const search =
      document.getElementById("search");

    let produtos = [];

    async function carregarProdutos() {

      try {

        const resposta =
          await fetch("/api/produtos");

        if (!resposta.ok) {
          throw new Error("Erro ao consultar produtos");
        }

        const dados =
          await resposta.json();

        console.log("Resposta da API:", dados);

        if (Array.isArray(dados)) {
          produtos = dados;
        } else if (Array.isArray(dados.produtos)) {
          produtos = dados.produtos;
        } else if (Array.isArray(dados.products)) {
          produtos = dados.products;
        } else if (Array.isArray(dados.data)) {
          produtos = dados.data;
        } else {
          produtos = [];
        }

        mostrarProdutos(produtos);

      } catch (erro) {

        console.error("Erro:", erro);

        productsContainer.innerHTML = `
          <div class="message">
            ❌ Não foi possível carregar os produtos.
          </div>
        `;
      }
    }

    function mostrarProdutos(lista) {

      if (!lista.length) {

        productsContainer.innerHTML = `
          <div class="message">
            Nenhum produto cadastrado.
          </div>
        `;

        return;
      }

      productsContainer.innerHTML = "";

      lista.forEach(produto => {

        const nome =
          produto.name ||
          produto.nome ||
          "Produto";

      const imagem =
  produto.image_url ||
  produto.imageUrl ||
  produto.image ||
  produto.imagem ||
  "https://via.placeholder.com/500x500?text=Produto";

        const descricao =
          produto.description ||
          produto.descricao ||
          "";

     const valorTexto = produto.price || produto.preco || 0;

const valor = Number(
  String(valorTexto)
    .replace("R$", "")
    .replace(/\./g, "")
    .replace(",", ".")
    .trim()
);

        const preco =
          valor.toFixed(2).replace(".", ",");

        const link =
          produto.shopee_url ||
          produto.offerLink ||
          produto.productLink ||
          produto.url ||
          produto.link ||
          "#";

        const card =
          document.createElement("div");

        card.className = "product";

        card.innerHTML = `

          <img
            class="product-image"
            src="${imagem}"
            alt="${nome}"
            onerror="this.src='https://via.placeholder.com/500x500?text=Produto'"
          >

          <div class="product-info">

            <h2 class="product-name">
              ${nome}
            </h2>

            ${
              descricao
              ? `<div class="product-description">
                   ${descricao}
                 </div>`
              : ""
            }

            <div class="price">
              R$ ${preco}
            </div>

            <a
              class="buy-button"
              href="${link}"
              target="_blank"
              rel="noopener noreferrer"
            >
              🛒 Comprar produto
            </a>

          </div>
        `;

        productsContainer.appendChild(card);

      });
    }

    search.addEventListener(
      "input",
      function() {

        const texto =
          this.value
            .toLowerCase()
            .trim();

        const filtrados =
          produtos.filter(produto => {

            const nome =
              String(
                produto.name ||
                produto.nome ||
                ""
              ).toLowerCase();

            return nome.includes(texto);
          });

        mostrarProdutos(filtrados);
      }
    );

    carregarProdutos();

  </script>

</body>
</html>
