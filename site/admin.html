<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Lojista | Nossalojaaqui</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f5f5f5;
  color: #222;
  padding: 20px 15px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.painel {
  background: #fff;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.10);
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitulo {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 17px;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: #fff;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #ffd900;
  color: #222;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.buscar {
  background: #111;
  color: #fff;
}

.preview {
  display: none;
  width: 220px;
  height: 220px;
  object-fit: contain;
  margin: 20px auto;
  border-radius: 12px;
  border: 1px solid #ddd;
  background: #fff;
}

.mensagem {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
}

.resultado {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #f7f7f7;
}

.ajuda {
  margin-top: 7px;
  color: #777;
  font-size: 13px;
}

.voltar {
  display: block;
  text-align: center;
  margin-top: 25px;
  color: #333;
  text-decoration: none;
}

.sucesso {
  color: green;
}

.erro {
  color: red;
}

.aviso {
  color: #b88600;
}
</style>
</head>

<body>

<div class="container">
<div class="painel">

<h1>⚙️ Painel do Lojista</h1>

<p class="subtitulo">
Cadastre produtos no Nossalojaaqui
</p>

<label for="nome">🏷️ Nome do produto</label>

<input
  type="text"
  id="nome"
  placeholder="Nome do produto"
>

<label for="preco">💰 Preço</label>

<input
  type="text"
  id="preco"
  placeholder="Ex.: 39,90"
>

<label for="categoria">📂 Categoria</label>

<select id="categoria">

<option value="">Selecione uma categoria</option>

<option value="Beleza">💄 Beleza</option>

<option value="Perfumes">🌸 Perfumes</option>

<option value="Casa">🏠 Casa</option>

<option value="Tecnologia">📱 Tecnologia</option>

<option value="Ofertas">🔥 Ofertas</option>

<option value="Outros">🎁 Outros</option>

</select>

<label for="link">🔗 Link do produto</label>

<input
  type="url"
  id="link"
  placeholder="Cole o link da Shopee, Magalu, SHEIN ou TikTok Shop"
>

<p class="ajuda">
Cole o link do produto e tente buscar os dados automaticamente.
</p>

<button
  type="button"
  class="buscar"
  onclick="buscarProduto()"
>
🔍 BUSCAR PRODUTO
</button>

<img
  id="preview"
  class="preview"
  alt="Foto do produto"
>

<div
  id="resultado"
  class="resultado"
></div>

<label for="descricao">📝 Descrição</label>

<textarea
  id="descricao"
  placeholder="Descrição do produto..."
></textarea>

<label for="cores">🎨 Cores</label>

<input
  type="text"
  id="cores"
  placeholder="Ex.: Preto, Branco, Azul"
>

<p class="ajuda">
Deixe vazio se não houver variações de cor.
</p>

<label for="tamanhos">📏 Tamanhos</label>

<input
  type="text"
  id="tamanhos"
  placeholder="Ex.: P, M, G, GG"
>

<p class="ajuda">
Deixe vazio se não houver tamanhos.
</p>

<button
  type="button"
  onclick="salvarProduto()"
>
💾 SALVAR PRODUTO
</button>

<div
  id="mensagem"
  class="mensagem"
></div>

<a
  class="voltar"
  href="/"
>
← Voltar para o site
</a>

</div>
</div>

<script>

function mostrarMensagem(texto, classe) {

  const mensagem =
    document.getElementById("mensagem");

  mensagem.className =
    "mensagem " + classe;

  mensagem.innerText =
    texto;
}


async function buscarProduto() {

  const link =
    document
      .getElementById("link")
      .value
      .trim();

  const preview =
    document
      .getElementById("preview");

  const resultado =
    document
      .getElementById("resultado");

  if (!link) {

    mostrarMensagem(
      "⚠️ Cole primeiro o link do produto.",
      "erro"
    );

    return;
  }

  mostrarMensagem(
    "⏳ Buscando informações do produto...",
    "aviso"
  );

  resultado.style.display = "none";

  try {

    const resposta =
      await fetch(
        "/api/shopee-produto",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            url: link
          })
        }
      );

    const texto =
      await resposta.text();

    let dados = {};

    try {

      dados =
        texto
          ? JSON.parse(texto)
          : {};

    } catch (erro) {

      throw new Error(
        "O servidor não retornou JSON válido. Status: " +
        resposta.status
      );

    }

    if (
      !resposta.ok ||
      dados.sucesso === false
    ) {

      throw new Error(
        dados.erro ||
        "Não foi possível buscar o produto."
      );

    }

    const produto =
      dados.produto || {};

    if (produto.name) {

      document
        .getElementById("nome")
        .value =
        produto.name;

    }

    if (produto.price) {

      document
        .getElementById("preco")
        .value =
        produto.price;

    }

    if (produto.description) {

      document
        .getElementById("descricao")
        .value =
        produto.description;

    }

    if (produto.imagem || produto.image_url) {

  preview.src =
    produto.imagem || produto.image_url;

  preview.style.display =
    "block";

}

    }

    if (produto.colors) {

      document
        .getElementById("cores")
        .value =
        Array.isArray(produto.colors)
          ? produto.colors.join(", ")
          : produto.colors;

    }

    if (produto.sizes) {

      document
        .getElementById("tamanhos")
        .value =
        Array.isArray(produto.sizes)
          ? produto.sizes.join(", ")
          : produto.sizes;

    }

    resultado.innerHTML =
      "<strong>✅ Produto encontrado</strong><br>" +
      "Confira os dados antes de salvar.";

    resultado.style.display =
      "block";

    mostrarMensagem(
      "✅ Dados encontrados. Confira e salve o produto.",
      "sucesso"
    );

  } catch (erro) {

    console.error(erro);

    mostrarMensagem(
      "❌ " + erro.message,
      "erro"
    );

  }

}


async function salvarProduto() {

  const nome =
    document
      .getElementById("nome")
      .value
      .trim();

  const preco =
    document
      .getElementById("preco")
      .value
      .trim();

  const categoria =
    document
      .getElementById("categoria")
      .value;

  const link =
    document
      .getElementById("link")
      .value
      .trim();

  const descricao =
    document
      .getElementById("descricao")
      .value
      .trim();

  const cores =
    document
      .getElementById("cores")
      .value
      .trim();

  const tamanhos =
    document
      .getElementById("tamanhos")
      .value
      .trim();

  const preview =
    document
      .getElementById("preview");

  const imagem =
    preview.src || "";

  if (!nome) {

    mostrarMensagem(
      "⚠️ Informe o nome do produto.",
      "erro"
    );

    return;
  }

  if (!preco) {

    mostrarMensagem(
      "⚠️ Informe o preço.",
      "erro"
    );

    return;
  }

  if (!categoria) {

    mostrarMensagem(
      "⚠️ Selecione uma categoria.",
      "erro"
    );

    return;
  }

  if (!link) {

    mostrarMensagem(
      "⚠️ Informe o link do produto.",
      "erro"
    );

    return;
  }

  mostrarMensagem(
    "⏳ Salvando produto...",
    "aviso"
  );

  try {

    const resposta =
      await fetch(
        "/api/produtos",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            name:
              nome,

            price:
              preco,

            category:
              categoria,

            image_url:
              imagem,

            shopee_url:
              link,

            description:
              descricao,

            colors:
              cores,

            sizes:
              tamanhos

          })

        }
      );

    const texto =
      await resposta.text();

    let dados = {};

    try {

      dados =
        texto
          ? JSON.parse(texto)
          : {};

    } catch (erro) {

      throw new Error(
        "O servidor não retornou uma resposta válida."
      );

    }

    if (
      !resposta.ok ||
      dados.sucesso === false
    ) {

      throw new Error(
        dados.erro ||
        "Não foi possível salvar o produto."
      );

    }

    mostrarMensagem(
      "✅ Produto salvo com sucesso!",
      "sucesso"
    );

    limparFormulario();

  } catch (erro) {

    console.error(erro);

    mostrarMensagem(
      "❌ " + erro.message,
      "erro"
    );

  }

}


function limparFormulario() {

  document.getElementById("nome").value = "";

  document.getElementById("preco").value = "";

  document.getElementById("categoria").value = "";

  document.getElementById("link").value = "";

  document.getElementById("descricao").value = "";

  document.getElementById("cores").value = "";

  document.getElementById("tamanhos").value = "";

  const preview =
    document.getElementById("preview");

  preview.src = "";

  preview.style.display =
    "none";

  document
    .getElementById("resultado")
    .style.display =
    "none";

}

</script>

</body>
</html>
