<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nossalojaaqui | Ofertas e Produtos</title>

  <meta
    name="description"
    content="Nossalojaaqui - Produtos, ofertas e oportunidades incríveis."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header h1 span {
      color: #ffd400;
    }

    header p {
      margin: 10px 0 0;
      color: #ddd;
    }

    .categorias {
      background: white;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
    }

    .categoria {
      border: 1px solid #ddd;
      background: white;
      border-radius: 14px;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: .2s;
    }

    .categoria:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px #ddd;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 15px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 20px;
    }

    .pesquisa {
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .pesquisa input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #produtos {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .produto {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px #ddd;
      transition: .2s;
    }

    .produto:hover {
      transform: translateY(-4px);
    }

    .produto img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      display: block;
      background: white;
    }

    .produto-info {
      padding: 16px;
    }

    .produto h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .descricao {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .preco {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 13px;
      background: #ffd400;
      color: #111;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      border: 0;
      cursor: pointer;
    }

    .botao:hover {
      background: #efc600;
    }

    .mensagem {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #777;
    }

    /* PAINEL */

    .painel {
      max-width: 700px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 3px 15px #ddd;
    }

    .painel h2 {
      margin-top: 0;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo textarea,
    .campo select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .campo textarea {
      min-height: 100px;
      resize: vertical;
    }

    .foto-preview {
      margin-top: 10px;
      text-align: center;
    }

    .foto-preview img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 10px;
      display: none;
      margin: auto;
    }

    .salvar {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .salvar:hover {
      background: #333;
    }

    #resultado {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    footer {
      margin-top: 50px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }

  </style>
</head>

<body>

<header>

  <h1>
    Bem-vindo à
    <span>Nossalojaaqui</span>
  </h1>

  <p>
    Produtos incríveis, ofertas especiais e oportunidades para você.
  </p>

</header>


<!-- CATEGORIAS -->

<div class="categorias">

  <button
    class="categoria"
    onclick="filtrar('Beleza')"
  >
    💄 Beleza
  </button>

  <button
    class="categoria"
    onclick="filtrar('Perfumes')"
  >
    🌸 Perfumes
  </button>

  <button
    class="categoria"
    onclick="filtrar('Casa')"
  >
    🏠 Casa
  </button>

  <button
    class="categoria"
    onclick="filtrar('Tecnologia')"
  >
    📱 Tecnologia
  </button>

  <button
    class="categoria"
    onclick="mostrarProdutos(todosProdutos)"
  >
    🎁 Todos
  </button>

</div>


<main class="container">

  <h2 class="titulo">
    🔥 Ofertas em destaque
  </h2>


  <!-- PESQUISA -->

  <div class="pesquisa">

    <input
      type="search"
      id="pesquisa"
      placeholder="🔎 Pesquisar produto..."
      oninput="pesquisarProduto()"
    >

  </div>


  <!-- PRODUTOS -->

  <div id="produtos">

    <div class="mensagem">
      Carregando produtos...
    </div>

  </div>


  <!-- PAINEL DE CADASTRO -->

  <section class="painel">

    <h2>
      ⚙️ Painel do lojista — adicionar produto
    </h2>

    <p>
      Cadastre nome, preço, foto, categoria,
      descrição e link do produto.
    </p>


    <form id="formProduto">


      <!-- NOME -->

      <div class="campo">

        <label for="nome">
          Nome do produto
        </label>

        <input
          type="text"
          id="nome"
          required
          placeholder="Ex.: Relógio Digital"
        >

      </div>


      <!-- PREÇO -->

      <div class="campo">

        <label for="preco">
          Preço
        </label>

        <input
          type="text"
          id="preco"
          placeholder="Ex.: 39,90"
        >

      </div>


      <!-- CATEGORIA -->

      <div class="campo">

        <label for="categoria">
          Categoria
        </label>

        <select id="categoria" required>

          <option value="">
            Selecione uma categoria
          </option>

          <option value="Beleza">
            💄 Beleza
          </option>

          <option value="Perfumes">
            🌸 Perfumes
          </option>

          <option value="Casa">
            🏠 Casa
          </option>

          <option value="Tecnologia">
            📱 Tecnologia
          </option>

        </select>

      </div>


      <!-- FOTO -->

      <div class="campo">

        <label for="foto">
          📷 Escolher foto do produto
        </label>

        <input
          type="file"
          id="foto"
          accept="image/*"
        >

        <div class="foto-preview">

          <img id="previewFoto" alt="Prévia">

        </div>

      </div>


      <!-- LINK -->

      <div class="campo">

        <label for="link">
          🔗 Link do produto
        </label>

        <input
          type="url"
          id="link"
          placeholder="https://..."
          required
        >

      </div>


      <!-- DESCRIÇÃO -->

      <div class="campo">

        <label for="descricao">
          📝 Descrição
        </label>

        <textarea
          id="descricao"
          placeholder="Descrição do produto..."
        ></textarea>

      </div>


      <button
        type="submit"
        class="salvar"
      >
        💾 SALVAR PRODUTO
      </button>


      <div id="resultado"></div>

    </form>

  </section>

</main>


<footer>

  © Nossalojaaqui

</footer>


<script>

let todosProdutos = [];

let fotoBase64 = "";


/* ==========================================
   CARREGAR PRODUTOS
========================================== */

async function carregarProdutos() {

  const area =
    document.getElementById("produtos");

  area.innerHTML = `
    <div class="mensagem">
      Carregando produtos...
    </div>
  `;

  try {

    const resposta =
      await fetch("/api/produtos");

    if (!resposta.ok) {
      throw new Error(
        "Erro ao buscar produtos"
      );
    }

    const dados =
      await resposta.json();

    todosProdutos =
      dados.produtos || [];

    mostrarProdutos(todosProdutos);

  }

  catch (erro) {

    console.error(erro);

    area.innerHTML = `
      <div class="mensagem">
        Não foi possível carregar os produtos.
      </div>
    `;

  }

}


/* ==========================================
   MOSTRAR PRODUTOS
========================================== */

function mostrarProdutos(produtos) {

  const area =
    document.getElementById("produtos");

  if (!produtos.length) {

    area.innerHTML = `
      <div class="mensagem">
        Nenhum produto encontrado.
      </div>
    `;

    return;

  }


  area.innerHTML = "";


  produtos.forEach(produto => {

    const nome =
      produto.name ||
      produto.nome ||
      produto.titulo ||
      "Produto";


    const descricao =
      produto.description ||
      produto.descricao ||
      "";


    const imagem =
      produto.image_url ||
      produto.imagem ||
      produto.image ||
      "https://via.placeholder.com/500x500?text=Nossalojaaqui";


    const preco =
      produto.price ||
      produto.preco ||
      "";


    const link =
      produto.shopee_url ||
      produto.link ||
      produto.url ||
      "#";


    const card =
      document.createElement("div");

    card.className = "produto";


    card.innerHTML = `

      <img
        src="${imagem}"
        alt="${nome}"
        onerror="
          this.src='https://via.placeholder.com/500x500?text=Produto'
        "
      >

      <div class="produto-info">

        <h3>
          ${nome}
        </h3>

        ${
          descricao
          ?
          `<div class="descricao">
            ${descricao}
          </div>`
          :
          ""
        }

        ${
          preco
          ?
          `<div class="preco">
            R$ ${preco}
          </div>`
          :
          ""
        }

        <a
          class="botao"
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >
          🛒 COMPRAR
        </a>

      </div>

    `;


    area.appendChild(card);

  });

}


/* ==========================================
   FILTRAR CATEGORIA
========================================== */

function filtrar(categoria) {

  const filtrados =
    todosProdutos.filter(produto => {

      const cat =
        produto.category ||
        produto.categoria ||
        "";

      return (
        cat.toLowerCase() ===
        categoria.toLowerCase()
      );

    });


  mostrarProdutos(filtrados);

}


/* ==========================================
   PESQUISAR
========================================== */

function pesquisarProduto() {

  const texto =
    document
      .getElementById("pesquisa")
      .value
      .toLowerCase();


  const filtrados =
    todosProdutos.filter(produto => {

      const nome =
        produto.name ||
        produto.nome ||
        "";


      const descricao =
        produto.description ||
        produto.descricao ||
        "";


      return (
        nome.toLowerCase().includes(texto) ||
        descricao.toLowerCase().includes(texto)
      );

    });


  mostrarProdutos(filtrados);

}


/* ==========================================
   ESCOLHER FOTO
========================================== */

document
  .getElementById("foto")
  .addEventListener(
    "change",
    function() {

      const arquivo =
        this.files[0];

      if (!arquivo) {
        return;
      }


      const leitor =
        new FileReader();


      leitor.onload =
        function(evento) {

          fotoBase64 =
            evento.target.result;


          const preview =
            document.getElementById(
              "previewFoto"
            );


          preview.src =
            fotoBase64;


          preview.style.display =
            "block";

        };


      leitor.readAsDataURL(arquivo);

    }
  );


/* ==========================================
   SALVAR PRODUTO
========================================== */

document
  .getElementById("formProduto")
  .addEventListener(
    "submit",
    async function(evento) {

      evento.preventDefault();


      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.textContent =
        "Salvando produto...";


      const nome =
        document
          .getElementById("nome")
          .value
          .trim();


      const preco =
        document
          .getElementById("preco")
          .value
          .trim();


      const categoria =
        document
          .getElementById("categoria")
          .value;


      const link =
        document
          .getElementById("link")
          .value
          .trim();


      const descricao =
        document
          .getElementById("descricao")
          .value
          .trim();


      try {

        const resposta =
          await fetch(
            "/api/produtos",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                name: nome,

                description:
                  descricao,

                image_url:
                  fotoBase64,

                shopee_url:
                  link,

                price:
                  preco,

                category:
                  categoria

              })

            }
          );


        const dados =
          await resposta.json();


        if (!resposta.ok ||
            !dados.sucesso) {

          throw new Error(
            dados.erro ||
            "Não foi possível salvar."
          );

        }


        resultado.textContent =
          "✅ Produto salvo com sucesso!";


        resultado.style.color =
          "green";


        document
          .getElementById("formProduto")
          .reset();


        document
          .getElementById("previewFoto")
          .style.display =
          "none";


        fotoBase64 = "";


        await carregarProdutos();

      }

      catch (erro) {

        console.error(erro);


        resultado.textContent =
          "❌ Erro: " +
          erro.message;


        resultado.style.color =
          "red";

      }

    }
  );


/* ==========================================
   INICIAR
========================================== */

carregarProdutos();

</script>

</body>
</html>
