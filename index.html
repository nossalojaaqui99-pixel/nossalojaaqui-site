<script>

function buscarProduto(texto) {

  const produtos = document.querySelectorAll(".product");

  texto = texto.toLowerCase();

  produtos.forEach(function(produto) {

    const nome = produto.innerText.toLowerCase();

    if (nome.includes(texto)) {
      produto.style.display = "";
    } else {
      produto.style.display = "none";
    }

  });

}

async function carregarProdutos() {

  const lista = document.getElementById("lista-produtos");

  try {

    const resposta = await fetch(
      "https://nossalojaaqui-site.nossalojaaqui99.workers.dev/api/produtos"
    );

    const dados = await resposta.json();

    if (!dados.sucesso) {
      throw new Error(dados.erro || "Erro ao carregar produtos");
    }

    if (!dados.produtos || dados.produtos.length === 0) {

      lista.innerHTML = `
        <div class="erro-produtos">
          <h3>Nenhum produto encontrado.</h3>
          <p>Novas ofertas serão adicionadas em breve.</p>
        </div>
      `;

      return;
    }

    lista.innerHTML = dados.produtos.map(function(produto) {

      const imagem = produto.image_url
        ? `<img src="${produto.image_url}" alt="${produto.name}" loading="lazy">`
        : `<div class="produto-sem-imagem">🛍️</div>`;

      return `
        <div class="product produto-real">

          <div class="product-image">
            ${imagem}
          </div>

          <div class="product-info">

            <h3>${produto.name}</h3>

            <p>${produto.description || ""}</p>

            <div class="price">
              Confira a oferta
            </div>

            <a
              href="${produto.shopee_url}"
              target="_blank"
              rel="noopener noreferrer"
              class="buy">
              🛒 COMPRAR NA SHOPEE
            </a>

          </div>

        </div>
      `;

    }).join("");

  } catch (erro) {

    console.error("Erro ao carregar produtos:", erro);

    lista.innerHTML = `
      <div class="erro-produtos">
        <h3>Não foi possível carregar as ofertas.</h3>
        <p>Tente atualizar a página.</p>
      </div>
    `;
  }
}

carregarProdutos();

</script>

</body>
</html>
